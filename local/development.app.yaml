---
server:
  port: 3000
  throttle:
    auth:
      ttl: 60s
      limit: 10
    users:
      ttl: 60s
      limit: 10
    profiles:
      ttl: 1s
      limit: 1

auth:
  jwt:
    access:
      secret: some_kind_of_secret_for_tokens
      expirationDuration: 60m
    refresh:
      secret: refresh_secret
      expirationDuration: 1w

hash:
  memoryCost: 4096
  timeCost: 3
  parallelism: 1

database:
  host: postgres
  port: 5432
  dbName: main
  username: root
  password: dummy_password_for_local_development
